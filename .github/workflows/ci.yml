# Continuous integration (roadmap step 8.5). Runs the same checks as the
# local Stop hook, plus the slow ones the hook skips.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  checks:
    name: Format, analyze, codegen, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyzer
        run: flutter analyze

      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code

      # Goldens were recorded on macOS; Linux renders text slightly
      # differently, so they run in the macOS job instead.
      - name: Unit and widget tests
        run: flutter test --exclude-tags golden

  macos:
    name: Goldens and integration (macOS)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Golden (screenshot) tests
        run: flutter test --tags golden

      - name: Integration journeys on a real macOS build
        run: flutter test integration_test -d macos
